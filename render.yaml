services:
  - type: web
    name: structured-data-extractor
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: DATABASE_URL
        fromDatabase:
          name: structured-data-extractor-db
          property: connectionString
      - key: MAX_INPUT_CHARS
        value: "30000"
      - key: APP_ENV
        value: production

databases:
  - name: structured-data-extractor-db
    plan: basic-256mb
    databaseName: extractor
    user: extractor
